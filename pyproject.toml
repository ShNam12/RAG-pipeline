[project]
name = "rag1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "quangnt03", email = "55090045+quangnt03@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.133.0",
    "llama-index-core>=0.14.25,<0.15",
    "paddleocr[doc-parser]==3.7.0",
    "einops>=0.6.1,<1",
    "paddlepaddle==3.3.0",
    "pillow>=10.0.0",
    "pypdfium2>=5.0.0,<6.0.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "qdrant-client>=1.19.1,<2",
    "sentence-transformers>=6.1,<7",
    "openai>=1.20.0",
    "setuptools<82",
    "torch>=2.0",
    "vietocr>=0.3.13,<0.4",
]

[project.optional-dependencies]
vl = ["paddleocr[doc-parser]==3.7.0", "einops>=0.6.1,<1"]
tabular = ["transformers>=5.17,<6", "torchvision>=0.29,<1"]

[dependency-groups]
dev = ["jsonschema>=4.26,<5"]

[tool.uv]
override-dependencies = ["einops>=0.6.1,<1"]

[project.scripts]
rag1 = "rag1:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }
